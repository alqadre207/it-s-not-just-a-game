<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Final Challenge</title>

<style>

body{
    margin:0;
    background:#050505;
    color:#00ff88;
    font-family:Consolas,monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:800px;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

#terminal{
    white-space:pre-line;
    line-height:34px;
    font-size:22px;
    min-height:420px;
}

#message{

margin-top:40px;

font-size:22px;

line-height:35px;

text-align:center;

}

.big{

font-size:60px;

text-align:center;

color:#00ff88;

text-shadow:0 0 25px #00ff88;

animation:glow 1.5s infinite alternate;

}

.name{

font-size:42px;

text-align:center;

color:white;

text-shadow:0 0 20px white;

}

@keyframes glow{

from{

text-shadow:0 0 10px #00ff88;

}

to{

text-shadow:0 0 35px #00ff88;

}

}
#loading{
    width:100%;
    height:12px;
    border:1px solid #00ff88;
    display:none;
    margin-top:25px;
}
#giftBtn{
    display:none;
    margin:40px auto;
    padding:15px 40px;
    background:#111;
    color:#ff69b4;
    border: 2px solid #ff69b4;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
    transition:.3s;
}
#giftBtn:hover{
transform:scale(1.1);
box-shadow:0 0 25px #ff69b4;    
}
.rose{
    position:fixed;
    top:-59px;
    font-size:30px;
    animation:fall 8s linear forwards;
    pointer-events:none;
}
@keyframes fall{
    0%{transform:translateY(0) rotate(0deg);}
    100%{transform:translateY(110vh) rotate(360deg);}
    }
#bar{
    width:0%;
    height:100%;
    background:#00ff88;
}

.cursor{
    animation:blink .8s infinite;
}

@keyframes blink{
    50%{opacity:0;}
}

</style>
</head>

<body>

<div class="container">

<div id="terminal"></div>

<div id="loading">
    <div id="bar"></div>
</div>

</div>

<audio id="bg4" src="../assets/sounds/bg4.mp3"></audio>

<script>
const lines=[

"INITIALIZING CENTRAL SYSTEM...",

"",

"Collecting recovered security keys...",

"",

"KEY 01 ............ HAPPY ✓",

"",

"KEY 02 ............ BIRTHDAY ✓",

"",

"KEY 03 ............ MARAM ✓",

"",

"VERIFYING KEYS..."

];

const terminal=document.getElementById("terminal");

let i=0;

function startBg4() {
    const music = document.getElementById("bg4");
    if (!music) return;
    music.currentTime = 0;
    music.loop = false;
    music.volume = 0.2;

    const playPromise = music.play();
    if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
            document.body.addEventListener('click', function oncePlay() {
                music.currentTime = 0;
                music.play().catch(() => {});
                document.body.removeEventListener('click', oncePlay);
            });
        });
    }
}

function typeLines(){

    if(i >= lines.length){

        terminal.innerHTML += "<span class='cursor'>█</span>";

        setTimeout(()=>{
            startLoading();
        },1000);

        return;
    }


    let text = lines[i];

    let color="#00ff88";

    if(text.includes("KEY"))
        color="#00ccff";

    if(
        text.includes("VERIFYING"))
        color="#ffaa00";
        
    if(     
        text.includes("INITIALIZING"))
        color="#00ff88";
    
    if( 
        text.includes("Collecting"))
        color="#00ff88";

    let span=document.createElement("span");
    span.style.color=color;
    terminal.appendChild(span);


    let char=0;


    function write(){

        if(char < text.length){

            span.innerHTML += text.charAt(char);

            char++;

            setTimeout(write,35);

        }else{

            terminal.innerHTML += "<br>";

            i++;

            setTimeout(typeLines,500);

        }

    }


    write();

}

function startLoading(){

    document.getElementById("loading").style.display="block";

    let progress=0;

    let interval=setInterval(()=>{

        progress++;

        document.getElementById("bar").style.width=progress+"%";

        if(progress>=100){

            clearInterval(interval);

            showGift();

        }

    },30);

} 
function showGift(){

    document.querySelector(".container").innerHTML=`


    <br><br>

    <div class="name">
        MARAM ❤️
    </div>

    <br><br>

    <div id="message"></div>
    <button id="giftBtn">OPEN YOUR LETTER❤️</button>

    `;

    const text=[
        "Every challenge...",
        "Every code...",
        "Every second...",
        "",
        "was made especially for you ❤️",
        "",
        "I hope this day brings you happiness.",
        "",
    ];

    let line=0;

    function writeLine(){

        if(line>=text.length){
            document.getElementById("giftBtn").style.display="block";
            return;
        }

        let msg=document.getElementById("message");

        let p=document.createElement("p");

        msg.appendChild(p);

        let char=0;

        function writeChar(){

            if(char<text[line].length){

                p.innerHTML+=text[line].charAt(char);

                char++;

                setTimeout(writeChar,40);

            }else{

                line++;

                setTimeout(writeLine,500);

            }

        }

        writeChar();

        setInterval(createRose,400);

    }

    writeLine();
    document.getElementById("giftBtn").onclick=function(){
        window.location.href = 'letter.html';
    }

}
function createRose(){

    let rose=document.createElement("div");

    rose.className="rose";

    rose.innerHTML="🌹";

    rose.style.left=Math.random()*100+"vw";

    rose.style.animationDuration=(6+Math.random()*4)+"s";

    document.body.appendChild(rose);

    setTimeout(()=>{
        rose.remove();
    },10000);

}

window.addEventListener('DOMContentLoaded', function() {
    startBg4();
    setTimeout(typeLines,1000);
});
</script>
<script src="../audio-manager.js"></script>

</body>
</html>
