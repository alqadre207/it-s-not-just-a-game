<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Challenge 2</title>

<style>

body{
background:#050505;
color:#00ff88;
font-family:Consolas,monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.shake{

animation:shake .4s;

}

@keyframes shake{

0%{transform:translateX(0);}
25%{transform:translateX(-8px);}
50%{transform:translateX(8px);}
75%{transform:translateX(-8px);}
100%{transform:translateX(0);}

}

input:focus{

outline:none;

box-shadow:0 0 20px #00ff88;

}

.container{
width:700px;
}

h1{
text-align:center;
margin-bottom:15px;
}

#terminal{
white-space:pre-line;
line-height:30px;
font-size:20px;
min-height:350px;
}

#loading{

width:100%;

height:10px;

border:1px solid #00ff88;

margin-top:25px;

display:none;

}

#bar{

width:0%;

height:100%;

background:#00ff88;

transition:.1s;

}

#verifyBox{
display:none;
margin-top:30px;
text-align:center;
}

input{

width:250px;

padding:12px;

background:black;

color:#00ff88;

border:1px solid #00ff88;

font-size:20px;

text-align:center;

}

button{

margin-top:20px;

padding:12px 30px;

background:#00ff88;

border:none;

cursor:pointer;

font-size:18px;

}

.verifyBtn{

margin:25px auto 0;

padding:14px 40px;

background:#111;

border:2px solid #00ff88;

color:#00ff88;

font-size:18px;

letter-spacing:2px;

font-family:Consolas;

cursor:pointer;

border-radius:10px;

transition:.35s;

display:flex;

align-items:center;

justify-content:center;

gap:10px;

box-shadow:0 0 15px rgba(0,255,136,.3);

}
.arrow{
    transition:.35s;
    font-size:20px;
}

.verifyBtn:hover{

background:#00ff88;

color:#000;

box-shadow:0 0 30px #00ff88;

transform:translateY(-2px);

}
.verifyBtn:hover .arrow{
    transform:translateX(8px);
}
.verifyContainer{
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:20px;
}
.verifyBtn:active{

transform:scale(.96);

}
.flash{
    color:#00ff88;
    text-shadow:0 0 20px #00ff88;
    animation:flash .15s 2;
}
@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0;}
    100%{opacity:1;}
}
#result{

margin-top:20px;

font-size:22px;

}
.cursor{

animation:blink .8s infinite;

}

@keyframes blink{

50%{

opacity:0;

}

}
</style>

</head>

<body>

<div class="container">

<h1>SECOND SECURITY TEST</h1>

<div id="terminal"></div>

<div id="verifyBox">

<p>ENTER THE RECOVERED CODE</p>

<input id="code">

<br>
<div class="verifyContainer">
<button type="button" class="verifyBtn" onclick="checkCode()">
<span class="arrow">▶</span> VERIFY CODE
</button>
</div>

<p id="result"></p>
<div id="loading" style="display:none;">

<div id="bar"></div>

</div>
</div>

<script>

const lines = [
"Recover the corrupted access code...",
"FSA-882",
"QP-019",
"AB-771",
"HJ-992",
"TR-001",
"KX-440",
"LM-287",
"AA-771",
"QP-441",
"CX-882",
"GH-110",
"KL-990",
"BIRTHDAY",
"RT-771",
"MN-118",
"ERROR...",
"TR-992",
"LQ-821",
"GH-221",
"AA-008",
"CX-110",
"LO-992",
"SYSTEM READY..."
];


    const terminal = document.getElementById("terminal");

let i = 0;

function typeLines(){

    if(i >= lines.length){

        terminal.innerHTML += "<span class='cursor'>█</span>";

        document.getElementById("verifyBox").style.display="block";

        return;

    }


    let text = lines[i];


    // السطر الأول حرف حرف
    if(i === 0){

        let char = 0;

        function writeChar(){

            if(char < text.length){

                terminal.innerHTML += text.charAt(char);

                char++;

                setTimeout(writeChar,80);

            }else{

                terminal.innerHTML += "<br>";

                i++;

                setTimeout(typeLines,1500);

            }

        }

        writeChar();


    }else{


        // باقي السطور كلمة كلمة
        if(text === "BIRTHDAY"){

    
            terminal.innerHTML += "<span class='flash'>"+text+"</span><br>";

        }else{
    
            terminal.innerHTML += text+"<br>";
        }
        if(text === "BIRTHDAY"){
            i++;
            setTimeout(typeLines,1000);
        }else{
            if(text === "BIRTHDAY"){
                i++;
                setTimeout(typeLines,900);
            }else{
                i++;
                setTimeout(typeLines,80);
            }
        }
        return;
    
    
        
    }
}


setTimeout(typeLines,1000);



function checkCode(){

let code=document.getElementById("code").value.toUpperCase();
let success = document.getElementById("successSound");
let error = document.getElementById("errorSound");

if(code=="BIRTHDAY"){

success.currentTime = 0;
success.play();

document.getElementById("result").innerHTML=

"CODE VERIFIED ✓<br>SECURITY KEY RECOVERED: BIRTHDAY<br>Decrypting next security layer...";

document.getElementById("loading").style.display="block";

let progress=0;

let interval=setInterval(()=>{

progress++;

document.getElementById("bar").style.width=progress+"%";

if(progress>=100){

clearInterval(interval);

window.location.href = "challenge3.html";

}

},30);

}else{

error.currentTime = 0;
error.play();

document.getElementById("result").innerHTML=
"<span style='color:red'>ACCESS DENIED<br>INVALID SECURITY CODE</span>";

let input=document.getElementById("code");

input.classList.add("shake");

setTimeout(()=>{

input.classList.remove("shake");

},500);

}

}


function playBackground2() {
    const bg2 = document.getElementById('bg2');
    if (!bg2) return;
    bg2.volume = 0.2;
    bg2.loop = false;

    const playPromise = bg2.play();
    if (playPromise && typeof playPromise.catch === 'function') {
        playPromise.catch(() => {
            document.body.addEventListener('click', function oncePlay() {
                bg2.play().catch(() => {});
                document.body.removeEventListener('click', oncePlay);
            });
        });
    }
}

document.addEventListener('DOMContentLoaded', playBackground2);
</script>
<audio id="bg2" src="../assets/sounds/bg2.mp3"></audio>
<audio id="terminalSound" src="../assets/sounds/terminal.mp3"></audio>
<audio id="errorSound" src="../assets/sounds/error.mp3"></audio>
<audio id="successSound" src="../assets/sounds/success.mp3"></audio>
<script src="../audio-manager.js"></script>
</body>

</html>
