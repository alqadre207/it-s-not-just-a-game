<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Verification</title>

<style>

body{
    margin:0;
    background:black;
    color:#00ff88;
    font-family:Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

#box{
    width:80%;
    max-width:700px;
    font-size:24px;
    line-height:1.8;
}

.cursor{
    display:inline-block;
    animation:blink 0.8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}


/* الشريط */

#loading{
    display:none;
    margin-top:30px;
}


.bar-box{
    width:100%;
    height:18px;
    background:#222;
    border-radius:10px;
    overflow:hidden;
}


#bar{
    width:0%;
    height:100%;
    background:#00ff88;
}


</style>

</head>


<body>


<div id="box">

<span id="text"></span><span class="cursor">█</span>


<div id="loading">

<br>

<div class="bar-box">

<div id="bar"></div>

</div>

<p id="percent">0%</p>

</div>


</div>



<script src="../audio-manager.js"></script>
<script>


let lines=[

"CONNECTION ESTABLISHED...",
"VERIFYING USER...",
"NAME : Maram",
"STATUS : VERIFIED ✓",
"Decrypting Files..."
];
let line=0;
let letter=0;
let text=document.getElementById("text");
function typeWriter(){
if(line < lines.length){
if(letter < lines[line].length){
text.innerHTML += lines[line][letter];
letter++;
setTimeout(typeWriter,50);
}else{
text.innerHTML += "<br>";

line++;
letter=0;

setTimeout(typeWriter,300);

}


}else{

startLoading();

}


}


typeWriter();



function startLoading(){


document.getElementById("loading").style.display="block";


let progress=0;


let timer=setInterval(()=>{


progress++;


document.getElementById("bar").style.width=progress+"%";


document.getElementById("percent").innerHTML=progress+"%";


if(progress>=100){
clearInterval(timer);
document.getElementById("loading").innerHTML += "ACCESS GRANTED ✓";
setTimeout(()=>{ window.location.href ="briefing.html";
},6000);
}
},30);
}



</script>


</body>
</html>
