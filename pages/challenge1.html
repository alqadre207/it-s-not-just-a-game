<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge 1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Consolas, monospace;
}

body{
background:#050505;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
}

h1{
color:#00ff88;
font-size:40px;
margin-bottom:15px;
}

p{
color:#bbbbbb;
margin-bottom:50px;
font-size:20px;
}

.cards{
display:flex;
gap:40px;
justify-content:center;
flex-wrap:wrap;
}

.card{

width:230px;
height:270px;

background:linear-gradient(145deg,#111,#222);

border:1px solid #00ff88;

border-radius:20px;

padding:20px;

display:flex;

flex-direction:column;

justify-content:space-between;

position:relative;

overflow:hidden;

transition:.4s;

cursor:pointer;

}


.card:hover{

transform:translateY(-15px) scale(1.05);

box-shadow:0 0 35px #00ff88;

}

.shake{

animation:shake .4s;

border-color:red;

}

.correct{

background:#00ff88;

color:black;

box-shadow:0 0 40px #00ff88;
transform:scale(1.1);

}

@keyframes shake{

0%{transform:translateX(0);}
25%{transform:translateX(-10px);}
50%{transform:translateX(10px);}
75%{transform:translateX(-10px);}
100%{transform:translateX(0);}

}

#result{

margin-top:40px;

font-size:24px;

height:40px;

.top{

display:flex;

justify-content:space-between;

color:#00ff88;

font-size:14px;

}


.dot{

width:12px;
height:12px;

background:#00ff88;

border-radius:50%;

box-shadow:0 0 15px #00ff88;

}


.chip{

width:55px;
height:40px;

background:#d4af37;

border-radius:8px;

}


.card h2{

font-size:20px;

color:white;

}


.card p{

font-size:28px;

letter-spacing:3px;

color:#00ff88;

}


.level{
font-size:22px;
color:#aaa;

}
}

</style>

</head>

<body>

<div class="container">

<h1>FIRST SECURITY TEST</h1>

<p>Select the valid access card.</p>

<div class="cards">

<div class="card" onclick="wrong(this)">
    <div class="top">
        <span>SECURITY</span>
        <div class="dot"></div>
    </div>

    <div class="chip"></div>

    <h2>ACCESS CARD</h2>

    <p>SAD</p>

    
</div>


<div class="card" onclick="correct(this)">
    <div class="top">
        <span>SECURITY</span>
        <div class="dot"></div>
    </div>

    <div class="chip"></div>

    <h2>ACCESS CARD</h2>

    <p>HAPPY</p>

</div>


<div class="card" onclick="wrong(this)">
    <div class="top">
        <span>SECURITY</span>
        <div class="dot"></div>
    </div>

    <div class="chip"></div>

    <h2>ACCESS CARD</h2>

    <p>XC-915</p>

</div>

</div>
<p id="result"></p>

</div>

<script src="../audio-manager.js"></script>
<script>

function wrong(card){
let sound = document.getElementById("errorSound");
sound.currentTime = 0;
sound.play();
card.classList.add("shake");

document.getElementById("result").innerHTML="ACCESS DENIED";

setTimeout(()=>{

card.classList.remove("shake");


},500);

}

function correct(card){
    document.querySelectorAll(".card").forEach(c=>{
        if(c!==card){
            c.style.opacity="0";
            c.style.transform="scale(0.8)";
        }
    });
let sound = document.getElementById("successSound");
sound.currentTime = 0;
sound.play();
card.classList.add("correct");

document.getElementById("result").innerHTML="ACCESS ACCEPTED ✓<br>SECURITY KEY RECOVERED: HAPPY<br>loading next security test...";

setTimeout(()=>{

window.location.href="challenge2.html";

},2000);

}

</script>
<audio id="successSound" src="../assets/sounds/success.mp3"></audio>

<audio id="errorSound" src="../assets/sounds/error.mp3"></audio>
</body>
</html>
